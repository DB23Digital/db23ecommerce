<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="60" y1="54" x2="1120" y2="706" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111625"/>
      <stop offset="0.6" stop-color="#181e32"/>
      <stop offset="1" stop-color="#B99A5F" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(850 300) rotate(135) scale(460 360)">
      <stop stop-color="#B99A5F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B99A5F" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="34" y="30" width="1132" height="704" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#080A10"/>
  
  <!-- Main Browser Window Mockup -->
  <rect x="60" y="54" width="1080" height="652" rx="34" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="60" y="54" width="1080" height="66" rx="34" fill="#0b1020" fill-opacity="0.95"/>
  
  <!-- Browser Window Controls -->
  <circle cx="104" cy="87" r="8" fill="#F87171"/>
  <circle cx="130" cy="87" r="8" fill="#FBBF24"/>
  <circle cx="156" cy="87" r="8" fill="#34D399"/>
  
  <!-- URL Address Bar -->
  <rect x="196" y="75" width="590" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="226" y="92" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="13">db23.co.za/arehm-dev/</text>
  
  <!-- Glow Overlay for modern feeling -->
  <rect x="60" y="120" width="1080" height="586" rx="0" fill="url(#glow)" style="mix-blend-mode: screen; pointer-events: none;"/>
  
  <!-- Brand Showcase Details -->
  <text x="112" y="210" fill="#B99A5F" font-family="Space Mono, Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">ENGINEERING &amp; CONSTRUCTION</text>
  <text x="112" y="300" fill="#FFFFFF" font-family="Syne, Inter, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-2">AREMH Devs</text>
  <text x="116" y="358" fill="#D1D5DB" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400">Industrial warehouses &amp; executive corporate housing.</text>
  <text x="116" y="388" fill="#9CA3AF" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="300">Premium commercial real estate operations in Soyo &amp; Cabinda.</text>
  
  <!-- CTA Button Mockup -->
  <rect x="116" y="440" width="260" height="56" rx="12" fill="#B99A5F"/>
  <text x="156" y="474" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1">Lease Proposals</text>
  
  <!-- Right Side Interactive Blueprint Graphic (AutoCAD style wireframe truss) -->
  <g transform="translate(680, 190)" opacity="0.85">
    <!-- Grid System Lines -->
    <line x1="0" y1="0" x2="360" y2="0" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="80" x2="360" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="160" x2="360" y2="160" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="240" x2="360" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="320" x2="360" y2="320" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <line x1="0" y1="0" x2="0" y2="320" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="320" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="320" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="320" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Warehouse Truss Outlines (Golden accent blueprint vectors) -->
    <!-- Base ground line -->
    <line x1="-30" y1="300" x2="390" y2="300" stroke="#B99A5F" stroke-width="2"/>
    
    <!-- Outer framing -->
    <path d="M 20 300 L 20 140 L 180 80 L 340 140 L 340 300 Z" fill="none" stroke="#B99A5F" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Inner columns -->
    <line x1="100" y1="300" x2="100" y2="110" stroke="#B99A5F" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="180" y1="300" x2="180" y2="80" stroke="#B99A5F" stroke-width="2"/>
    <line x1="260" y1="300" x2="260" y2="110" stroke="#B99A5F" stroke-width="1.5" stroke-dasharray="4,4"/>
    
    <!-- Horizontal beams -->
    <line x1="20" y1="140" x2="340" y2="140" stroke="#B99A5F" stroke-width="1.5"/>
    <line x1="20" y1="220" x2="340" y2="220" stroke="#B99A5F" stroke-width="1"/>
    
    <!-- Structural truss diagonals -->
    <path d="M 20 140 L 100 110 L 180 80 L 260 110 L 340 140" fill="none" stroke="#B99A5F" stroke-width="2"/>
    <path d="M 20 140 L 100 140 L 180 140 L 260 140 L 340 140" fill="none" stroke="#B99A5F" stroke-width="1"/>
    <path d="M 20 140 L 100 110 L 100 140 L 180 140 L 180 80" fill="none" stroke="#B99A5F" stroke-width="1" opacity="0.6"/>
    <path d="M 340 140 L 260 110 L 260 140 L 180 140" fill="none" stroke="#B99A5F" stroke-width="1" opacity="0.6"/>
    
    <!-- Coordinate/Measurement indicators -->
    <circle cx="180" cy="80" r="5" fill="#FFFFFF" stroke="#B99A5F" stroke-width="1.5"/>
    <circle cx="20" cy="140" r="4" fill="#FFFFFF" stroke="#B99A5F" stroke-width="1"/>
    <circle cx="340" cy="140" r="4" fill="#FFFFFF" stroke="#B99A5F" stroke-width="1"/>
    
    <text x="180" y="55" fill="rgba(255,255,255,0.7)" font-family="Space Mono, Inter, Arial, sans-serif" font-size="10" text-anchor="middle">H = 8.0m</text>
    <text x="180" y="325" fill="rgba(255,255,255,0.7)" font-family="Space Mono, Inter, Arial, sans-serif" font-size="10" text-anchor="middle">SPAN = 32.0m</text>
  </g>
</svg>
